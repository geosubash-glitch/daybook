# Builds the Daybook Android app (APK) on GitHub's free build machines.
# Runs by itself whenever the website files change, and can be started by hand from the Actions tab.
# The app contains the whole journal screen inside it, so it opens and lets you write even with no internet.
# Your entries still live online in your Firebase account and upload when you are connected.
name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', 'android-res/**', 'signing/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm install --no-audit --no-fund @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor-firebase/authentication@8 firebase@12
      - name: Configure the app
        run: |
          cat > capacitor.config.json <<JSON
          {
            "appId": "app.daybook.journal",
            "appName": "Daybook",
            "webDir": "docs",
            "server": { "androidScheme": "https" },
            "android": { "backgroundColor": "#FBFBFA" },
            "plugins": { "FirebaseAuthentication": { "skipNativeAuth": true, "providers": ["google.com"] } }
          }
          JSON
      - name: Create the Android project
        run: |
          npx cap add android
          cp signing/google-services.json android/app/google-services.json
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
          cp -r android-res/. android/app/src/main/res/
          echo "--- build targets"; grep -rn "targetSdkVersion\|compileSdkVersion\|minSdkVersion" android/variables.gradle
          grep -q "targetSdkVersion = 36" android/variables.gradle || (echo "Target SDK is not 36, Google Play would reject this build" && exit 1)
          sed -i 's#@drawable/splash#@color/ic_launcher_background#' android/app/src/main/res/values/styles.xml
          npx cap sync android
      - name: Use the same signing key every time, so new versions install over old ones
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
      - name: Build, signed with the project's own key (Google sign-in checks this signature)
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
      - name: Check the signature matches the one registered in Firebase
        run: |
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$SIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee certs.txt
          grep -qi "SHA-1 digest: b5889ce85539570061d7ca31cb20b1981fcc1ffe" certs.txt || (echo "Wrong signing key: Google sign-in would fail" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: Daybook-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Daybook Android app
          body: Download app-debug.apk on your phone and open it to install or update.
          files: android/app/build/outputs/apk/debug/app-debug.apk
