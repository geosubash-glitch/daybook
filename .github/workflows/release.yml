# Builds the release-signed app (.apk for Indus Appstore and other stores, .aab for Google Play).
# Runs only when you start it by hand from the Actions tab, and only after the four secrets below exist.
# See PUBLISHING.md, step 3.
name: Build release app
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
    steps:
      - name: Check the signing secrets exist
        run: |
          [ -n "$KEYSTORE_B64" ] || (echo "Add the UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS and UPLOAD_KEY_PASSWORD secrets first. See PUBLISHING.md." && exit 1)
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install Capacitor
        run: npm install --no-audit --no-fund @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor-firebase/authentication@8 firebase@12 @capacitor/filesystem@8 @capacitor/share@8 @capacitor/local-notifications@8 @capacitor/app@8 @capacitor/haptics@8 @capacitor/preferences@8
      - name: Configure the app
        run: |
          cat > capacitor.config.json <<JSON
          {
            "appId": "app.daybook.journal",
            "appName": "Daybook",
            "webDir": "docs",
            "server": { "androidScheme": "https" },
            "android": { "backgroundColor": "#FBFBFA" },
            "plugins": { "FirebaseAuthentication": { "skipNativeAuth": true, "providers": ["google.com"] }, "LocalNotifications": { "smallIcon": "ic_stat_daybook", "iconColor": "#0F0F10" } }
          }
          JSON
      - name: Create the Android project
        run: |
          npx cap add android
          cp signing/google-services.json android/app/google-services.json
          cp -r android-res/. android/app/src/main/res/
          cp -r android-native/java/. android/app/src/main/java/
          python3 android-native/patch_manifest.py
          sed -i 's#@drawable/splash#@color/ic_launcher_background#' android/app/src/main/res/values/styles.xml
          grep -q "targetSdkVersion = 36" android/variables.gradle || (echo "Target SDK is not 36" && exit 1)
          sed -i '/^dependencies {/a\    implementation "androidx.biometric:biometric:1.1.0"' android/app/build.gradle
          grep -n biometric android/app/build.gradle
          npx cap sync android
          rm -rf android/app/src/main/assets/public/media   # promo video is for the website only, keep it out of the app
          sed -i "s/__BUILD__/v1.$(( ${{ github.run_number }} - 7 ))/" android/app/src/main/assets/public/app.js
      - name: Build and sign
        working-directory: android
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.keystore" \
            -Pandroid.injected.signing.store.password="$UPLOAD_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$UPLOAD_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$UPLOAD_KEY_PASSWORD"
          rm -f "$RUNNER_TEMP/upload.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: Daybook-play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Daybook-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Publish the APK for the website download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Daybook.apk
          gh release view release-latest >/dev/null 2>&1 || gh release create release-latest --title "Daybook (signed release)" --notes "Latest signed Android build, linked from the website." --latest=false
          gh release upload release-latest Daybook.apk --clobber
      - name: Publish a numbered release (lets Obtainium and other updaters see new versions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.$(( ${{ github.run_number }} - 7 ))"
          cp android/app/build/outputs/apk/release/app-release.apk Daybook.apk
          gh release create "$TAG" Daybook.apk --title "Daybook $TAG" --notes "Signed Android build. Install over an earlier signed build to update." --latest
